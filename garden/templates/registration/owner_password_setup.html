{% load static %}
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#284e3b">
  <link rel="stylesheet" href="{% static 'garden/app.css' %}?v=20260925p2">
  <title>Välj lösenord · Trädgårdsrytmen</title>
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">DITT GRÖNA RUM</p>
    {% if validlink %}
      <h1>Välj ditt lösenord.</h1>
      <p>Länken fungerar en gång och upphör efter en timme.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Spara lösenord</button>
      </form>
    {% else %}
      <h1>Länken gäller inte längre.</h1>
      <p>Be administratören skapa en ny engångslänk.</p>
    {% endif %}
  </main>
</body>
</html>
