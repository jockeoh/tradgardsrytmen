name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      OPENAI_API_KEY: ''
      TRADGARDSRYTMEN_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: P3_SQLITE_TEST_PATH="$RUNNER_TEMP/p3-test.sqlite3" python manage.py test --settings=config.p3_sqlite_test_settings --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py create_private_owner --username ci-owner > /dev/null
      - run: python manage.py seed_demo --owner ci-owner
      - run: python manage.py collectstatic --noinput

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p3
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: p3
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENAI_API_KEY: ''
      TRADGARDSRYTMEN_DB_ENGINE: postgresql
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: p3
      PGPASSWORD: synthetic-ci-password
      PGDATABASE: p3
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
